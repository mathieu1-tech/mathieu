<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MKS Admin Panel</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
  <div class="admin-login-shell" id="loginView">
    <form class="login-card" id="loginForm">
      <img src="assets/images/logo.png" alt="Mathieu Konstruct Solutions logo" class="login-logo" />
      <p class="eyebrow">Admin Access</p>
      <h1>Mathieu Konstruct Solutions</h1>
      <p class="muted">Static demo admin control panel for editing website content stored in localStorage.</p>
      <label>Username<input type="text" id="loginUsername" placeholder="admin" required /></label>
      <label>Password<input type="password" id="loginPassword" placeholder="mks2026" required /></label>
      <button type="submit" class="btn primary">Login</button>
      <p class="error-message" id="loginError"></p>
      <p class="hint">Demo credentials: <strong>admin</strong> / <strong>mks2026</strong></p>
    </form>
  </div>

  <div class="admin-app hidden" id="adminApp">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/images/logo.png" alt="Logo" />
        <div>
          <strong>MKS Admin</strong>
          <small>Content Manager</small>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <button data-section="dashboard" class="active">Dashboard</button>
        <button data-section="brand">Brand</button>
        <button data-section="hero">Hero</button>
        <button data-section="about">About</button>
        <button data-section="vision">Vision & Mission</button>
        <button data-section="services">Services</button>
        <button data-section="products">Products</button>
        <button data-section="specifications">Specifications</button>
        <button data-section="materials">Materials</button>
        <button data-section="gallery">Gallery</button>
        <button data-section="contact">Contact</button>
        <button data-section="seo">SEO</button>
        <button data-section="theme">Theme</button>
        <button data-section="backup">Backup / Restore</button>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="topbar">
        <div>
          <h1 id="adminPageTitle">Dashboard</h1>
          <p class="muted">Manage editable content for the MKS GitHub Pages website.</p>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" id="previewBtn">Preview Website</button>
          <button class="btn primary" id="saveAllBtn">Save Changes</button>
          <button class="btn danger" id="logoutBtn">Logout</button>
        </div>
      </header>

      <section class="panel-section active" id="panel-dashboard"></section>
      <section class="panel-section" id="panel-brand"></section>
      <section class="panel-section" id="panel-hero"></section>
      <section class="panel-section" id="panel-about"></section>
      <section class="panel-section" id="panel-vision"></section>
      <section class="panel-section" id="panel-services"></section>
      <section class="panel-section" id="panel-products"></section>
      <section class="panel-section" id="panel-specifications"></section>
      <section class="panel-section" id="panel-materials"></section>
      <section class="panel-section" id="panel-gallery"></section>
      <section class="panel-section" id="panel-contact"></section>
      <section class="panel-section" id="panel-seo"></section>
      <section class="panel-section" id="panel-theme"></section>
      <section class="panel-section" id="panel-backup"></section>
    </main>
  </div>

  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
