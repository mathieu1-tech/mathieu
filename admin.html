:root {
  --bg: #071f1c;
  --bg-soft: #0f312d;
  --panel: #ffffff;
  --line: rgba(7, 61, 57, 0.12);
  --text: #132321;
  --muted: #60716d;
  --accent: #0b5a53;
  --accent-2: #0f786e;
  --danger: #ab2b2b;
  --radius: 20px;
  --shadow: 0 20px 45px rgba(0,0,0,.12);
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:#edf2f0;color:var(--text)}
.hidden{display:none!important}.muted{color:var(--muted)}
.eyebrow{margin:0 0 8px;color:#7fc7bf;text-transform:uppercase;letter-spacing:.18em;font-size:.78rem;font-weight:800}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:#0b5a53;color:#fff}.btn.primary:hover{background:#0f786e}
.btn.ghost{background:#ecf3f1;color:#0b5a53}.btn.ghost:hover{background:#dbe9e5}
.btn.danger{background:#ffe8e8;color:#9c1f1f}.btn.danger:hover{background:#ffd4d4}
.btn.small{padding:8px 12px;font-size:.85rem}.file-btn{position:relative;overflow:hidden}
.admin-login-shell{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#0b5a53,#071f1c 60%)}
.login-card{width:min(480px,calc(100% - 32px));background:rgba(255,255,255,.97);padding:34px;border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.login-card h1{margin:0 0 8px;font-size:2rem}.login-logo{width:72px;height:72px;border-radius:18px;object-fit:contain;margin-bottom:16px}
.login-card label{display:block;margin-top:16px;font-weight:700}.login-card input{width:100%;margin-top:8px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);font:inherit}
.login-card .btn{width:100%;margin-top:20px}.error-message{min-height:20px;color:#b3261e}.hint{font-size:.92rem;color:var(--muted)}
.admin-app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{background:var(--bg);color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:10px 8px 22px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:18px}
.sidebar-brand img{width:54px;height:54px;border-radius:14px;object-fit:contain;background:#fff;padding:4px}.sidebar-brand strong{display:block}.sidebar-brand small{color:#b4c8c5}
.sidebar-nav{display:grid;gap:8px}.sidebar-nav button{padding:12px 14px;border-radius:14px;border:0;background:transparent;color:#dfe9e7;text-align:left;font-weight:700;cursor:pointer}
.sidebar-nav button.active,.sidebar-nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.admin-main{padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.topbar h1{margin:0;font-size:2rem}.topbar-actions{display:flex;gap:12px;flex-wrap:wrap}
.panel-section{display:none}.panel-section.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.stat-card{background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow)}.stat-card span{display:block;color:var(--muted);margin-bottom:8px}.stat-card strong{font-size:1.6rem}.stat-wide{grid-column:span 2}
.notice-card,.editor-card{background:#fff;border-radius:22px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:18px}.editor-card h3,.notice-card h3{margin-top:0}
.form-grid{display:grid;gap:16px}.form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid label{display:block;font-weight:700}.form-grid input,.form-grid textarea,.form-grid select{width:100%;margin-top:8px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);font:inherit;background:#fbfdfc}.form-grid textarea{min-height:120px;resize:vertical}
.array-editor-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.array-editor-list{display:grid;gap:16px}.array-item{background:#f8fbfa;border:1px solid var(--line);border-radius:18px;padding:18px}.array-item-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.array-actions{display:flex;gap:8px;flex-wrap:wrap}
.backup-actions{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:1100px){.admin-app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat-wide{grid-column:auto}}
@media (max-width:700px){.admin-main{padding:18px}.topbar{flex-direction:column;align-items:flex-start}.form-grid.two,.stats-grid{grid-template-columns:1fr}.array-item-head{flex-direction:column;align-items:flex-start}}

window.storageKeys = { data: 'mksSiteData', savedAt: 'mksSiteDataSavedAt' };
window.cloneSiteData = function cloneSiteData(data) {
  return JSON.parse(JSON.stringify(data));
};
window.getSiteData = function getSiteData() {
  try {
    const raw = localStorage.getItem(window.storageKeys.data);
    if (!raw) return window.cloneSiteData(window.defaultSiteData);
    const parsed = JSON.parse(raw);
    return Object.assign(window.cloneSiteData(window.defaultSiteData), parsed);
  } catch (err) {
    console.error('Failed to load site data', err);
    return window.cloneSiteData(window.defaultSiteData);
  }
};
window.saveSiteData = function saveSiteData(data) {
  const clean = window.cloneSiteData(data);
  localStorage.setItem(window.storageKeys.data, JSON.stringify(clean));
  localStorage.setItem(window.storageKeys.savedAt, new Date().toISOString());
};
window.getSiteSavedAt = function getSiteSavedAt() {
  return localStorage.getItem(window.storageKeys.savedAt) || '';
};

function q(selector) { return document.querySelector(selector); }
function qa(selector) { return Array.from(document.querySelectorAll(selector)); }
function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function savedAtText() {
  const savedAt = window.getSiteSavedAt();
  return savedAt ? new Date(savedAt).toLocaleString() : 'Not saved yet';
}
function loginState(isLoggedIn) {
  q('#loginView').classList.toggle('hidden', isLoggedIn);
  q('#adminApp').classList.toggle('hidden', !isLoggedIn);
}
function showSection(key) {
  qa('.sidebar-nav button').forEach(btn => btn.classList.toggle('active', btn.dataset.section === key));
  qa('.panel-section').forEach(panel => panel.classList.toggle('active', panel.id === `panel-${key}`));
  q('#adminPageTitle').textContent = key === 'vision' ? 'Vision & Mission' : key.charAt(0).toUpperCase() + key.slice(1);
}
function saveAll() {
  window.saveSiteData(siteData);
  renderAll();
  alert('Changes saved successfully. Preview the homepage to see updates.');
}
function field(label, id, value, type='text', placeholder='') {
  if (type === 'textarea') return `<label>${label}<textarea id="${id}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></label>`;
  return `<label>${label}<input type="${type}" id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`;
}
function card(title, inner) { return `<div class="editor-card"><h3>${title}</h3>${inner}</div>`; }

function bindSimpleFields(mappings) {
  mappings.forEach(([selector, path]) => {
    const node = q(selector);
    if (!node) return;
    node.addEventListener('input', () => {
      let ref = siteData;
      for (let i = 0; i < path.length - 1; i++) ref = ref[path[i]];
      ref[path[path.length - 1]] = node.value;
      renderDashboardOnly();
    });
  });
}

}

function arrayEditor(containerSelector, title, items, fields, options = {}) {
  const container = q(containerSelector);
  const fieldInputs = item => fields.map(f => f.type === 'textarea'
    ? `${field(f.label, `${options.key}-${f.key}`, item[f.key] || '', 'textarea')}`
    : `${field(f.label, `${options.key}-${f.key}`, item[f.key] || '')}`).join('');
  container.innerHTML = `
    <div class="array-editor-head">
      <h3>${title}</h3>
      <button class="btn primary small" id="add-${options.key}">Add Item</button>
    </div>
    <div class="array-editor-list">
      ${items.map((item, index) => `
        <div class="array-item" data-index="${index}">
          <div class="array-item-head">
            <strong>${esc(item[options.labelKey] || `${title} ${index + 1}`)}</strong>
            <div class="array-actions">
              <button class="btn small ghost" data-action="up" ${index === 0 ? 'disabled' : ''}>↑</button>
              <button class="btn small ghost" data-action="down" ${index === items.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="btn small danger" data-action="delete">Delete</button>
            </div>
          </div>
          <div class="form-grid two">
            ${fields.map(f => {
              const val = item[f.key] || '';
              if (f.type === 'select') {
                return `<label>${f.label}<select data-field="${f.key}">${f.options.map(opt => `<option value="${esc(opt)}" ${opt === val ? 'selected' : ''}>${esc(opt)}</option>`).join('')}</select></label>`;
              }
              if (f.type === 'textarea') return `<label>${f.label}<textarea data-field="${f.key}">${esc(val)}</textarea></label>`;
              return `<label>${f.label}<input type="text" data-field="${f.key}" value="${esc(val)}"></label>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>`;

  q(`#add-${options.key}`).addEventListener('click', () => {
    items.push(options.newItem());
    renderAll();
  });

  container.querySelectorAll('.array-item').forEach(itemNode => {
    const idx = Number(itemNode.dataset.index);
    itemNode.querySelectorAll('[data-field]').forEach(input => {
      input.addEventListener('input', () => {
        items[idx][input.dataset.field] = input.value;
        if (input.dataset.field === options.labelKey) renderAll();
      });
    });
    itemNode.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'delete') items.splice(idx, 1);
      if (action === 'up' && idx > 0) [items[idx - 1], items[idx]] = [items[idx], items[idx - 1]];
      if (action === 'down' && idx < items.length - 1) [items[idx + 1], items[idx]] = [items[idx], items[idx + 1]];
      renderAll();
    }));
  });
}

function renderBackupSection() {
  q('#panel-backup').innerHTML = `
    <div class="editor-card">
      <h3>Backup & Restore</h3>
      <div class="backup-actions">
        <button class="btn primary" id="resetDefaultBtn">Reset to Default Catalog Content</button>
        <button class="btn ghost" id="exportJsonBtn">Export JSON Backup</button>
        <label class="btn ghost file-btn">Import JSON Backup<input type="file" id="importJsonInput" accept="application/json" hidden></label>
        <button class="btn danger" id="clearLocalBtn">Clear Local Changes</button>
      </div>
      <p class="muted">Export the current editable data to a JSON file or import a previous backup.</p>
    </div>`;
  q('#resetDefaultBtn').addEventListener('click', () => {
    if (!confirm('Reset all content to the default catalog data?')) return;
    siteData = window.cloneSiteData(window.defaultSiteData);
    window.saveSiteData(siteData);
    renderAll();
  });
  q('#exportJsonBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(siteData, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'mks-site-data-backup.json';
    link.click();
    URL.revokeObjectURL(link.href);
  });
  q('#importJsonInput').addEventListener('change', event => {
    const file = event.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        siteData = Object.assign(window.cloneSiteData(window.defaultSiteData), JSON.parse(reader.result));
        renderAll();
        alert('Backup imported. Click Save Changes to persist it.');
      } catch (err) {
        alert('Invalid JSON backup file.');
      }
    };
    reader.readAsText(file);
  });
  q('#clearLocalBtn').addEventListener('click', () => {
    if (!confirm('Clear locally saved changes and reload defaults?')) return;
    localStorage.removeItem(window.storageKeys.data);
    localStorage.removeItem(window.storageKeys.savedAt);
    siteData = window.cloneSiteData(window.defaultSiteData);
    renderAll();
  });
}

  renderBrandSection();

  renderThemeSection();
  renderBackupSection();
}

document.addEventListener('DOMContentLoaded', () => {
  const isLoggedIn = sessionStorage.getItem(LOGIN_KEY) === 'true';
  loginState(isLoggedIn);
  if (isLoggedIn) renderAll();

  q('#loginForm').addEventListener('submit', event => {
    event.preventDefault();
    const username = q('#loginUsername').value.trim();
    const password = q('#loginPassword').value;
    if (username === ADMIN_USER && password === ADMIN_PASS) {
      sessionStorage.setItem(LOGIN_KEY, 'true');
      q('#loginError').textContent = '';
      loginState(true);
      renderAll();
      showSection('dashboard');
    } else {
      q('#loginError').textContent = 'Invalid username or password.';
    }
  });

  q('#sidebarNav').addEventListener('click', event => {
    const btn = event.target.closest('button[data-section]');
    if (!btn) return;
    showSection(btn.dataset.section);
  });

  q('#previewBtn').addEventListener('click', () => window.open('index.html', '_blank'));
  q('#saveAllBtn').addEventListener('click', saveAll);
  q('#logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem(LOGIN_KEY);
    loginState(false);
  });
  showSection('dashboard');
});
</script>
